title: "Architecture: Guardrail"
content: |
  # Architecture: Guardrail
  
  ## Component Map
  
  ```
  guardrail/
  ├── .claude-plugin/
  │   ├── plugin.json                  # Plugin manifest (name, version, skills)
  │   └── marketplace.json             # Marketplace registry entry
  ├── skills/
  │   ├── init/
  │   │   └── SKILL.md                 # /guardrail init — stack detection, config generation
  │   └── audit/
  │       └── SKILL.md                 # /guardrail audit — rule analysis, consolidation
  ├── stacks/                          # Stack detection + permission data (JSON)
  │   ├── _base.json                   # Universal safe defaults (always included)
  │   ├── python.json
  │   ├── node.json
  │   ├── rust.json
  │   ├── go.json
  │   └── shell.json
  ├── rules/                           # Cross-cutting permission modules (JSON)
  │   ├── git.json
  │   ├── web.json
  │   ├── docker.json
  │   ├── mcp-ideate.json
  │   └── mcp-cyberbrain.json
  ├── sandbox/
  │   └── default.json                 # Default sandbox template
  ├── CLAUDE.md                        # Plugin-level instructions
  └── README.md                        # User-facing documentation
  ```
  
  ### Relationship Diagram
  
  ```
                    ┌──────────────┐
                    │ plugin.json  │  Registers skills, defines plugin identity
                    │ marketplace  │
                    └──────┬───────┘
                           │ references
              ┌────────────┴────────────┐
              │                         │
      ┌───────▼───────┐        ┌───────▼────────┐
      │  init/SKILL.md │        │ audit/SKILL.md │
      │  (skill logic) │        │  (skill logic) │
      └───┬───┬───┬───┘        └───┬────┬───────┘
          │   │   │                │    │
          │   │   │   reads        │    │  reads
          │   │   └────────┐       │    └──────┐
          │   │            │       │           │
     ┌────▼───▼──┐   ┌────▼───┐  ┌▼────────┐  │
     │ stacks/*  │   │rules/* │  │ global   │  │
     │ (plugin)  │   │(plugin)│  │ settings │  │
     └─────┬─────┘   └───┬────┘  └──────────┘  │
           │             │                      │
     ┌─────▼─────┐  ┌────▼────┐          ┌─────▼─────┐
     │ stacks/*  │  │ rules/* │          │  local     │
     │ (project) │  │(project)│          │  settings  │
     │ overrides │  │overrides│          │  .local    │
     └───────────┘  └─────────┘          └───────────┘
  
     Plugin defaults:     ${CLAUDE_PLUGIN_ROOT}/stacks/*, rules/*
     Project overrides:   .claude/guardrail/stacks/*, rules/*
     Settings output:     .claude/settings.local.json
     Global settings:     ~/.claude/settings.json (read-only)
  ```
  
  ## Data Flow
  
  ### Init Workflow
  
  ```
  1. USER invokes /guardrail init
  2. SKILL reads all JSON files from:
     - ${CLAUDE_PLUGIN_ROOT}/stacks/*.json    (plugin defaults)
     - .claude/guardrail/stacks/*.json        (project overrides)
  3. SKILL globs project directory against each stack's detect.files patterns
  4. SKILL presents detected stacks (pre-selected) + available rule modules
  5. USER confirms/adjusts selections
  6. SKILL reads selected stack JSONs + rule JSONs
  7. SKILL merges: _base → stacks → rules → sandbox template
     - allow[]: union + dedup
     - deny[]: union + dedup
     - sandbox.allowedDomains: union
     - sandbox.denyWrite: union
  8. SKILL checks for existing .claude/settings.local.json
     - If exists: show diff, offer merge or replace
     - If no git repo: confirm write location with user
  9. USER confirms final config
  10. SKILL writes permissions + sandbox keys to settings.local.json
      (preserves all other keys in the file)
  ```
  
  ### Audit Workflow
  
  ```
  1. USER invokes /guardrail audit
  2. SKILL reads:
     - ~/.claude/settings.json                (global)
     - .claude/settings.local.json            (local)
     - ${CLAUDE_PLUGIN_ROOT}/stacks/*.json    (for pattern matching)
     - ${CLAUDE_PLUGIN_ROOT}/rules/*.json     (for pattern matching)
  3. SKILL builds effective ruleset (global + local combined)
  4. SKILL classifies each rule in local settings:
     - Generalizable: specific rule matchable by a broader pattern
     - One-off: session artifacts (hashes, loop fragments, specific paths)
     - Redundant: already covered by global or a broader local rule
     - Risky: matches deny-list patterns (rm -rf, sudo, curl|sh)
     - Clean: well-scoped, appropriate
  5. SKILL presents categorized report
  6. USER selects fix mode: fix-all | fix-one-by-one | export-only
  7. SKILL applies fixes (with confirmation), writes updated settings
  ```
  
  ## Module Specifications
  
  Seven modules total. Each has a dedicated spec at `plan/modules/{name}.md`.
  
  | Module | Type | Purpose |
  |--------|------|---------|
  | `plugin-manifest` | Config | Plugin identity, skill registration, marketplace entry |
  | `init-skill` | Skill (markdown) | Stack detection, config generation, interactive menu |
  | `audit-skill` | Skill (markdown) | Rule analysis, classification, consolidation |
  | `stack-data` | Data (JSON) | Stack definitions with detection patterns and permissions |
  | `rule-data` | Data (JSON) | Cross-cutting permission modules |
  | `sandbox-data` | Data (JSON) | Default sandbox template |
  | `readme` | Documentation | User-facing usage guide |
  
  ## Interface Contracts
  
  Skills are markdown instructions, not code. "Interfaces" here mean the data shapes that skills read and produce. These contracts define the JSON schemas that bind the modules together.
  
  ### Stack JSON Schema (stack-data -> init-skill, audit-skill)
  
  ```typescript
  // stacks/*.json
  interface StackModule {
    name: string;                          // e.g. "python"
    description: string;                   // e.g. "Python development stack"
    detect: {
      files: string[];                     // glob patterns, e.g. ["*.py", "pyproject.toml"]
      match: "any" | "all";               // any = OR, all = AND
    };
    permissions: {
      allow: string[];                     // e.g. ["Bash(python3:*)"]
      deny?: string[];                     // e.g. ["Bash(sudo:*)"]
    };
    sandbox?: {
      filesystem?: {
        allowWrite?: string[];
        denyWrite?: string[];
      };
      network?: {
        allowedDomains?: string[];
      };
    };
  }
  ```
  
  ### Rule JSON Schema (rule-data -> init-skill, audit-skill)
  
  ```typescript
  // rules/*.json
  interface RuleModule {
    name: string;                          // e.g. "git"
    description: string;                   // e.g. "Git version control operations"
    auto?: boolean;                        // if true, always included without prompting
    permissions: {
      allow: string[];
      deny?: string[];
    };
  }
  ```
  
  ### Sandbox Template Schema (sandbox-data -> init-skill)
  
  ```typescript
  // sandbox/default.json
  interface SandboxTemplate {
    enabled: boolean;
    filesystem: {
      allowWrite: string[];
      denyWrite: string[];
    };
    network: {
      allowedDomains: string[];
    };
  }
  ```
  
  ### Settings Output Schema (init-skill -> filesystem, audit-skill -> filesystem)
  
  ```typescript
  // .claude/settings.local.json (only keys guardrail touches)
  interface SettingsOutput {
    permissions: {
      allow: string[];
      deny: string[];
    };
    sandbox: {
      enabled: boolean;
      filesystem: {
        allowWrite: string[];
        denyWrite: string[];
      };
      network: {
        allowedDomains: string[];
      };
    };
    // ... other keys preserved as-is
  }
  ```
  
  ### Plugin Manifest Schema (plugin-manifest -> Claude Code runtime)
  
  ```typescript
  // .claude-plugin/plugin.json
  interface PluginManifest {
    name: string;
    version: string;
    description: string;
    skills: Array<{
      name: string;
      path: string;
      description: string;
    }>;
  }
  
  // .claude-plugin/marketplace.json
  interface MarketplaceEntry {
    name: string;
    description: string;
    author: string;
    version: string;
    repository: string;
    tags: string[];
  }
  ```
  
  ## Execution Order
  
  ### Parallel Groups
  
  The following can be built simultaneously with no dependencies between them:
  
  **Group 1 — Data files (all independent):**
  - `stack-data` — All stack JSON files
  - `rule-data` — All rule JSON files
  - `sandbox-data` — Default sandbox template
  
  **Group 2 — Infrastructure (independent of data content, depends on schema agreement):**
  - `plugin-manifest` — plugin.json and marketplace.json
  
  ### Sequential Dependencies
  
  ```
  Group 1 (stack-data, rule-data, sandbox-data)
    │
    ├─► init-skill (must know the JSON schemas to write instructions that read them)
    │
    └─► audit-skill (must know the JSON schemas + rule syntax for classification)
         │
         └─► readme (must describe both skills accurately)
  ```
  
  ### Critical Path
  
  ```
  stack-data + rule-data + sandbox-data
    └─► init-skill
         └─► audit-skill (can reference init's conventions for consistency)
              └─► readme
  ```
  
  Total depth: 4 sequential stages. The data files are the foundation because the skills are instructions for Claude that reference specific file paths and JSON structures.
  
  ## Design Tensions
  
  ### 1. Skill complexity vs. data simplicity
  
  **Tension:** The guiding principle "data-driven, not code-driven" pushes domain knowledge into JSON. But skills are markdown instructions for Claude — they must contain enough logic (in natural language) to perform detection, merging, classification, and diffing. The "logic" has to live somewhere.
  
  **Resolution:** JSON files own the **what** (which patterns to detect, which permissions to grant, which commands are dangerous). Skill markdown owns the **how** (iterate files, merge arrays, present menus, classify rules). This is analogous to a template engine: the data is the model, the skill is the template. Neither duplicates the other's concerns.
  
  ### 2. Project overrides: merge semantics
  
  **Tension:** When a project has `.claude/guardrail/stacks/python.json` and the plugin ships `stacks/python.json`, what happens? Replace the plugin version? Deep merge? This affects extensibility.
  
  **Resolution:** Same-name files in project scope **replace** the plugin-scoped version entirely. This is the simplest model and avoids partial-merge ambiguity. Users who want to extend (not replace) a stack should use a differently-named file (e.g., `python-extra.json`). The skill instructions will document this behavior.
  
  ### 3. Audit scope: global settings are read-only
  
  **Tension:** Audit reads global `~/.claude/settings.json` to identify redundant local rules, but constraint 13 says "does not propose modifications to global settings." If a user has risky rules in global settings, audit can report them but cannot fix them.
  
  **Resolution:** Audit reports global findings in a separate "Global Observations" section clearly marked as informational. Fix actions only target `.claude/settings.local.json`. This keeps the v1 scope bounded while still providing full visibility.
  
  ### 4. Detection confidence
  
  **Tension:** A project with a single `Makefile` gets the `shell` stack. A monorepo might match 4 stacks. There is no confidence scoring — just "files exist or they don't."
  
  **Resolution:** Accept binary detection for v1. All detected stacks are pre-selected in the menu, and the user can deselect. The interview explicitly deferred sophistication here: "Best effort for v1. Will iterate later." The interactive confirmation step is the safety valve.
  
  ### 5. Sandbox enabled by default vs. platform support
  
  **Tension:** The interview says "sandbox enabled by default." But sandboxing requires Seatbelt (macOS) or bubblewrap (Linux). On unsupported platforms, enabling sandbox in settings would have no effect or cause errors.
  
  **Resolution:** Init enables sandbox by default but the skill checks the platform. On macOS, sandbox is enabled. On Linux, the skill notes that bubblewrap must be installed. The sandbox key is still written (Claude Code handles the platform check at runtime), but the skill warns if the platform may not support it. This follows guiding principle 5 (defense in depth): if sandboxing is unavailable, warn and compensate with tighter permission rules.
  
  ## 100% Coverage Check
  
  1. **Every module's scope is accounted for:**
     - Plugin registration and marketplace: `plugin-manifest`
     - Stack detection and permission data: `stack-data`
     - Cross-cutting rule data: `rule-data`
     - Sandbox configuration: `sandbox-data`
     - Init workflow (detection, menu, merge, write): `init-skill`
     - Audit workflow (load, classify, report, fix): `audit-skill`
     - User documentation: `readme`
     - CLAUDE.md (plugin instructions): owned by `plugin-manifest` scope
  
  2. **No overlapping scopes:**
     - `stack-data` owns stack JSON content; `init-skill` owns the logic that reads it
     - `rule-data` owns rule JSON content; both skills read it
     - `sandbox-data` owns the template; `init-skill` merges into it
     - `audit-skill` reads settings files; `init-skill` writes them
     - `readme` documents; it does not define behavior
  
  3. **Union of scopes equals full project scope:**
     - All files in the plugin directory tree are claimed by exactly one module
     - Both user-facing workflows (init, audit) are covered
     - Distribution (marketplace) is covered
     - Documentation is covered
  
  4. **Cross-module dependencies have matching Provides/Requires:**
     - `stack-data` provides StackModule schema -> `init-skill` and `audit-skill` require it
     - `rule-data` provides RuleModule schema -> `init-skill` and `audit-skill` require it
     - `sandbox-data` provides SandboxTemplate -> `init-skill` requires it
     - `plugin-manifest` provides skill registration -> Claude Code runtime requires it
  
  **Result: Full coverage confirmed. No gaps or overlaps.**
