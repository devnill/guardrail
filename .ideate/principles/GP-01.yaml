id: GP-01
type: guiding_principle
name: Maximize Autonomy Within Safety Boundaries
status: active
description: The primary goal is reducing permission prompts by 80%+ while maintaining security against prompt injection and destructive commands. When a design decision involves a tradeoff between convenience and safety, prefer the option that achieves both — sandbox enforcement over permission prompts, generalized allowlists over specific ones. Only sacrifice convenience when there is no safe alternative.
