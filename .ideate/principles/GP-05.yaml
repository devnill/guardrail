id: GP-05
type: guiding_principle
name: Defense in Depth
status: active
description: "Security comes from layered enforcement: OS-level sandboxing (Seatbelt/bubblewrap) as the foundation, deny rules as the safety net, and generalized allow rules as the convenience layer. No single layer is relied upon exclusively. If sandboxing is unavailable on the platform, the plugin warns and compensates with tighter permission rules."
