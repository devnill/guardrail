id: GP-02
type: guiding_principle
name: Data-Driven, Not Code-Driven
status: active
description: Stack definitions, rule modules, and deny lists are JSON data files. Adding support for a new stack or rule set means adding a new JSON file, not modifying plugin logic. The skill reads and interprets data; it does not encode detection or classification logic in its own markdown. This keeps the system extensible without forking.
