id: GP-04
type: guiding_principle
name: Smart Suggestions Over Dumb Lists
status: active
description: Guardrail's value is not in maintaining a list of allowed commands — it's in making intelligent recommendations. Audit doesn't just flag problems; it suggests consolidations. Init doesn't dump a generic config; it detects the stack and tailors the output. The plugin should surface the "why" behind each recommendation so users can make informed decisions.
