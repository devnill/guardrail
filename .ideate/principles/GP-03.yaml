id: GP-03
type: guiding_principle
name: Never Clobber Without Permission
status: active
description: Guardrail never silently overwrites existing configuration. When conflicts exist between generated and existing settings, the user is asked. When writing to `settings.local.json`, only the `permissions` and `sandbox` keys are touched — all other keys are preserved. Destructive changes require explicit confirmation.
